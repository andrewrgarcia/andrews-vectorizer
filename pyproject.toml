[project]
name = "andrews-vectorizer"
version = "0.1.0"
description = "Convert raster images into clean SVG vector graphics."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "svgwrite>=1.4.3",
    "vtracer>=0.6.15",
]

[tool.setuptools.packages.find]
include = ["andrews_vectorizer*"]